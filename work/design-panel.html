<section id="blog-design" data-blog-panel="design" role="tabpanel" aria-labelledby="tab-design" class="blog-panel" hidden>
<div class="design-workspace"><div class="design-sheet-scroll" tabindex="0" aria-label="Post layout" data-i18n-aria-label="Post layout"><article class="design-sheet">
<div class="blog-author"><span id="design-avatar" aria-hidden="true"></span><strong id="design-author-name"></strong></div><h2 id="design-title" lang="en"></h2>
<div class="design-grid-wrap"><div id="design-grid"></div></div><p id="design-empty" class="blog-hint" data-i18n="Add your text or photos using the controls.">Add your text or photos using the controls.</p></article></div>
<aside class="design-tools" aria-label="Design controls" data-i18n-aria-label="Design controls">
<h2 data-i18n="Arrange your post">Arrange your post</h2><p class="blog-hint" data-i18n="Tap an element, then use the controls to move or resize it.">Tap an element, then use the controls to move or resize it.</p>
<label for="design-add-kind" data-i18n="Add an element">Add an element</label><select id="design-add-kind"></select>
<label for="design-add-width" data-i18n="Width">Width</label><select id="design-add-width"><option value="1" data-i18n="1 column">1 column</option><option value="2" data-i18n="2 columns">2 columns</option><option value="3" data-i18n="3 columns">3 columns</option></select>
<label for="design-add-height" data-i18n="Photo height">Photo height</label><select id="design-add-height"><option value="1" data-i18n="Short">Short</option><option value="2" selected data-i18n="Medium">Medium</option><option value="3" data-i18n="Tall">Tall</option></select>
<button id="design-add" class="ah-button" data-i18n="Add">Add</button>
<p id="design-selected" class="blog-hint"></p><fieldset id="design-selection"><legend data-i18n="Selected element">Selected element</legend>
<label for="design-width" data-i18n="Width">Width</label><select id="design-width"><option value="1" data-i18n="1 column">1 column</option><option value="2" data-i18n="2 columns">2 columns</option><option value="3" data-i18n="3 columns">3 columns</option></select>
<label for="design-height" data-i18n="Photo height">Photo height</label><select id="design-height"><option value="1" data-i18n="Short">Short</option><option value="2" data-i18n="Medium">Medium</option><option value="3" data-i18n="Tall">Tall</option></select>
<div class="design-moves"><button id="design-up" class="ah-button" data-i18n="Up">Up</button><button id="design-down" class="ah-button" data-i18n="Down">Down</button><button id="design-left" class="ah-button" data-i18n="Left">Left</button><button id="design-right" class="ah-button" data-i18n="Right">Right</button></div></fieldset>
<p class="blog-hint" data-i18n="Text grows to fit. Removing an element here keeps your original writing and photos.">Text grows to fit. Removing an element here keeps your original writing and photos.</p>
<button id="design-default" class="ah-button" data-i18n="Default layout">Default layout</button><p id="design-message" role="status" class="blog-hint"></p>
</aside></div></section>
