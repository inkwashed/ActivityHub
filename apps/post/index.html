<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a personal digital postcard and share it with a link."><meta name="referrer" content="no-referrer"><title>ほんの手紙 POST</title><link rel="icon" type="image/svg+xml" href="assets/envelope-heart.svg"><link rel="stylesheet" href="fonts.css?v=card-fonts"><link rel="stylesheet" href="japanese-fonts.css"><link rel="stylesheet" href="style.css?v=reset-icon"><script defer src="data.js?v=american-colors"></script><script defer src="qr.js?v=1"></script><script defer src="qr-ui.js?v=1"></script><script defer src="app.js?v=reset-icon"></script></head>
<body><header><a class="brand" href="./"><img src="assets/envelope-heart.svg" width="48" height="48" alt=""><span><span lang="ja" class="brand-japanese">ほんの手紙</span> POST</span></a><div class="brand-taglines"><span lang="ja">ほんの気持ちを、手紙に。</span><span lang="en">A little note. A lovely moment.</span></div></header>
<main><section class="preview" aria-label="Card preview"><div class="preview-top"><span id="preview-title">Your design</span><span id="save-status" role="status"></span></div><div id="preview-orientation" role="group" aria-label="Card orientation"><button type="button" data-orientation="portrait" aria-pressed="true">Portrait</button><button type="button" data-orientation="landscape" aria-pressed="false">Landscape</button></div><p id="preview-face-label" class="face-label">FRONT</p><div class="cards"></div></section>
<section class="editor" id="editor"><nav id="steps" aria-label="Card creation progress"></nav><p id="active-step-label" aria-live="polite"></p><div id="controls"></div><p id="notice" role="status" aria-live="polite"></p><div class="navigation"><button id="previous" type="button">Previous</button><span id="step-count"></span><button id="next" type="button" class="primary">Next</button></div></section><section id="recipient" hidden></section></main><dialog id="text-color-dialog" aria-labelledby="text-color-title" aria-describedby="text-color-help">
<h2 id="text-color-title">Text color</h2><p id="text-color-help" class="hint">Choose a preset or pick your own color.</p>
<div id="color-finishes" hidden><label class="metallic-toggle"><input id="metallic-finish" type="checkbox" role="switch"> Metallic</label></div><div id="text-color-presets" class="color-presets"></div>
<label for="text-color-custom">Custom color</label><input type="color" id="text-color-custom">
<label for="text-color-hex">Hex color</label><input id="text-color-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off">
<p id="color-sample" class="color-sample"></p><p id="color-feedback" class="hint" role="status"></p>
<div class="dialog-actions"><button type="button" id="cancel-text-color">Cancel</button><button type="button" class="primary" id="apply-text-color">Apply color</button></div>
</dialog><footer>Made to be shared.</footer><noscript>Please enable JavaScript to create or open a postcard.</noscript></body></html>
