<!doctype html><html lang="en"><meta charset="utf-8"><title>My Town layout checks</title><button id="run">Run checks</button><pre id="results"></pre><iframe title="My Town test" id="app"></iframe><script>
run.onclick=async()=>{
 const out=document.querySelector('#results'),frame=document.querySelector('#app');out.textContent='Running…';let count=0;
 const wait=()=>new Promise(r=>setTimeout(r,100));
 try{
 frame.src='../../apps/my-town/';await new Promise(r=>frame.onload=r);
 const w=frame.contentWindow,d=w.document;
 const testVoice={root:d,config:{toppings:[],sauces:[]}};
 const style=d.createElement('style');style.textContent='html.enlarged button,html.enlarged select,html.enlarged .hint,html.enlarged h2{font-size:200%!important}html.enlarged .builder-output{font-size:42px!important}';d.head.append(style);
 for(const [width,height] of [[1133,678],[1133,599],[1133,380],[768,1024],[390,844]])for(const lang of ['en','ja'])for(const large of [false,true])for(const route of [false,true]){
 frame.style.width=width+'px';frame.style.height=height+'px';w.ActivityHubI18n.setLanguage(lang,false);d.documentElement.classList.toggle('enlarged',large);
 const mode=d.querySelector('#route-mode');mode.checked=route;mode.dispatchEvent(new w.Event('change'));
 if(large)d.querySelector('#sentence').append(d.createTextNode(' Go straight for two blocks. Turn right. Cross the bridge. Continue three blocks. You can see it on your left.'.repeat(8)));
 if(route){
 d.querySelectorAll('.order .pronunciation-speaker').forEach(el=>el.remove());
 const sentence=w.TownModel.directions({blocks:Array(12).fill('park'),route:[17,12,11,10,5,20,21,22,7,8,9,14,13,12],facing:0,destination:0});
 testVoice.pronunciation=null;w.FoodBuilder.prototype.setSentence.call(testVoice,sentence+' '+sentence+' '+sentence);
 }
 await wait();const menu=d.querySelector('.town-menu'),panel=d.querySelector('.pantry'),output=d.querySelector('.builder-output');
 const p=panel.getBoundingClientRect(),o=output.getBoundingClientRect();
 if(p.bottom>o.top+1)throw Error('Panels overlap');
 if(d.documentElement.scrollWidth>width+1)throw Error('Horizontal page overflow');
 if(width>=740&&height>380&&d.documentElement.scrollHeight>height+2)throw Error('Desktop page overflow');
 if(output.clientHeight<40)throw Error('Output inaccessible');
 for(const selector of ['#place-options button:last-child','#share','.builder-output']){
 if(route&&selector.startsWith('#place'))continue;
 const target=d.querySelector(selector);target.scrollIntoView({block:'end'});await wait();
 const r=target.getBoundingClientRect();if(r.bottom>w.innerHeight+2||r.bottom<0)throw Error('Column content unreachable: '+selector);
 }
 for(const selector of ['.pantry','#place-options','#route-tools','.builder-output']){
 const e=d.querySelector(selector),css=w.getComputedStyle(e);if(css.overflowY==='auto'||css.overflowY==='scroll')throw Error('Nested scrolling: '+selector);
 }
 if(route){
 const speaker=d.querySelector('.order .pronunciation-speaker');
 if(!speaker)throw Error('Missing Listen');
 output.scrollIntoView({block:'start'});await wait();
 if(width>=740&&height>380)menu.scrollTop+=60;else w.scrollBy(0,60);
 await wait();
 const b=speaker.getBoundingClientRect(),text=d.querySelector('#sentence').getBoundingClientRect(),row=speaker.parentElement.getBoundingClientRect();
 if(b.width<44||b.height<44||b.left<text.right-1)throw Error('Listen target or text overlap');
 const scrollTop=width>=740&&height>380?menu.getBoundingClientRect().top:0;
 if(row.bottom>scrollTop+60&&b.top<scrollTop-1)throw Error('Listen scrolled out of view');
 speaker.focus();if(d.activeElement!==speaker)throw Error('Listen keyboard focus');
 }
 count++;
 }
 out.textContent='PASS '+count+' combinations: languages, modes, sizes, 200% text, single-column scrolling and final choice/action/output reachability.';
 }catch(e){out.textContent='FAIL after '+count+': '+e.message}
};
</script></html>
